# MANUAL / out-of-band deploy workflow — DEDICATED server avorelio (87.239.135.156) + OUR
# self-hosted Traefik (docs/07-deployment.md §Топология №2, ADR-057).
#
# IMPORTANT — DEPLOY ORDERING (incident fix): the PRIMARY, automatic deploy on push to main lives
# as the `deploy-avorelio` JOB inside .github/workflows/ci.yml, gated by `needs: [quality, test,
# build-image]` so it CANNOT start until the whole CI suite is green. This file NO LONGER triggers
# on push (that previously caused deploy to race / precede CI). It is `workflow_dispatch` ONLY —
# for manual redeploys (e.g. re-run after DNS/Let's-Encrypt settle, or redeploy current main HEAD
# on .156 without a new commit). The deploy steps are identical to ci.yml's `deploy-avorelio`.
#
# claude-hermes has exactly ONE deploy target: its OWN dedicated server .156. This repo does NOT
# deploy to any shared/foreign server.
#
# The image is BUILT ON THE SERVER (`docker compose up -d --build`), not pulled from a registry —
# there is no immutable registry tag in this scheme (ADR-057 §5 == ADR-017).
#
# Flow: SSH to .156 -> cd /opt/claude-hermes -> git pull --ff-only ->
#   compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml build api migrate ->
#   run --rm migrate -> up postgres redis traefik (normal) + up --force-recreate api (ONLY api,
#   adopts the freshly built image; stateful/edge untouched) -> readiness gate
#   (claude-hermes-api-1 healthy = compose healthcheck GET /ready: db+redis) -> NON-FATAL public
#   smoke https://avorelio.shop/healthz.
#
# GitHub Secrets (Settings -> Secrets and variables -> Actions): NEVER hardcode these.
#   SSH_HOST_AVORELIO=87.239.135.156
#   SSH_USER=root
#   SSH_PRIVATE_KEY  (private key whose public half is in .156's ~/.ssh/authorized_keys)
# The /opt/claude-hermes/.env on .156 (ACME_EMAIL, SERVICE_DOMAIN=avorelio.shop,
# TRAEFIK_CERTRESOLVER=le, DB/LLM secrets) is provisioned ON THE SERVER from the secret manager
# (ADR-057 §5), NOT via GitHub Secrets. `.env` is gitignored and survives `git pull`.
#
# ROLLBACK on .156 (no registry/immutable tag), in /opt/claude-hermes:
#   git log --oneline -n 5 ; git checkout <prev-commit>
#   docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env build api migrate
#   docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env run --rm migrate  # if needed
#   docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env up -d --no-build --no-deps --force-recreate api
# (force-recreate ONLY api so it adopts the rolled-back image — the stale-code footgun applies to
# rollback too; postgres/redis/traefik stay up and are NOT force-recreated.)
# The traefik container is NOT changed on rollback (pinned image, config in the overlay).
# Schema is NOT reverted (expand/contract migrations keep the old code compatible). See
# docs/07-deployment.md §Откат and infra/deploy/README.md.

name: deploy

on:
  # MANUAL ONLY (from the Actions tab). The automatic push:main deploy is the gated
  # `deploy-avorelio` job in ci.yml — see the header. Do NOT add a `push` trigger here or deploy
  # will again race CI.
  workflow_dispatch:

# Only one deploy at a time for this target; do NOT cancel an in-flight deploy (avoid half-applied
# state). Same group as ci.yml's deploy-avorelio job so manual and gated deploys never overlap.
concurrency:
  group: deploy-avorelio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-avorelio:
    name: ssh deploy (dedicated .156 + self-hosted Traefik)
    runs-on: ubuntu-latest
    # Optional GitHub Environment for required reviewers / protection rules on prod deploys.
    environment: production
    steps:
      - name: Deploy over SSH (avorelio .156)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_AVORELIO }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Same hardened design as ci.yml's deploy-avorelio: script_stop MUST be false; remote
          # shell governed solely by `set -uo pipefail` (NO `-e`). Real failures go red via the
          # explicit rc checks + readiness gate; the fused `up` exit code is not trusted.
          script_stop: false
          script: |
            set -uo pipefail   # NO `-e` on purpose (consistent with ci.yml deploy-avorelio)
            DIR=/opt/claude-hermes
            PROJ=claude-hermes
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env"
            echo "[avorelio] === dir=$DIR project=$PROJ (self-hosted Traefik) ==="
            cd "$DIR" || { echo "::error title=cd failed::$DIR missing on .156"; exit 1; }
            echo "[avorelio] git pull --ff-only"
            if ! git pull --ff-only; then
              echo "::error title=git pull failed::ff-only pull failed in $DIR"; exit 1
            fi
            echo "[avorelio] build api migrate (image built on the server)"
            if ! $COMPOSE build api migrate; then
              echo "::error title=build failed::docker compose build returned non-zero"; exit 1
            fi
            echo "[avorelio] migrate (alembic upgrade head)"
            if ! $COMPOSE run --rm migrate; then
              echo "::error title=migrate failed::alembic upgrade head returned non-zero"; exit 1
            fi
            # SPLIT up (incident fix, identical to ci.yml deploy-avorelio): force-recreate ONLY
            # api so it adopts the freshly built image; NEVER force-recreate postgres/redis/traefik.
            # ROOT CAUSE: `up -d` keys recreation off the service CONFIG hash, which references the
            # image by its STABLE TAG (…-backend:prod), not the resolved image ID; a rebuild under
            # the same tag leaves that hash unchanged, so a plain `up -d --no-build` kept the OLD api
            # container (stale code) while /ready (db+redis) stayed green.
            #   (3a) stateful/edge — NORMAL up (start if down, leave healthy untouched). --no-deps so
            #        traefik does not drag api in. Protects postgres(data)/redis(cache)/traefik(:443+ACME).
            echo "[avorelio] up postgres redis traefik (normal up — protect stateful/ACME; NO force-recreate)"
            up_infra_rc=0
            $COMPOSE up -d --no-build --no-deps postgres redis traefik || up_infra_rc=$?
            echo "[avorelio] up(infra) rc=$up_infra_rc (informational)"
            #   (3b) api ONLY — --force-recreate (unconditional) + --no-deps (deps already satisfied:
            #        migrate ran in step 2, infra up in 3a; guarantees stateful services are untouched).
            echo "[avorelio] up --force-recreate api ONLY (adopt freshly built image; stateful UNTOUCHED)"
            up_rc=0
            $COMPOSE up -d --no-build --no-deps --force-recreate api || up_rc=$?
            echo "[avorelio] up(api) rc=$up_rc (informational; readiness gate decides)"
            echo "[avorelio] readiness gate: api container health"
            ready=0
            for i in $(seq 1 30); do
              h="$(docker inspect "${PROJ}-api-1" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
              if [ "$h" = "healthy" ]; then echo "[avorelio] api healthy ($i)"; ready=1; break; fi
              echo "[avorelio] api health=$h ($i/30) — retrying in 2s"; sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error title=api not healthy::api did not become healthy within ~60s (up rc=$up_rc). Last logs:"
              docker logs "${PROJ}-api-1" --tail 40 2>&1 || true
              exit 1
            fi
            url="https://avorelio.shop/healthz"
            echo "[avorelio:smoke] GET $url"
            smoke_ok=0
            for i in $(seq 1 12); do
              if curl -fsS --max-time 5 "$url" >/dev/null; then
                echo "[avorelio:smoke] healthz OK"; smoke_ok=1; break
              fi
              echo "[avorelio:smoke] not ready ($i/12) — retrying in 5s"; sleep 5
            done
            if [ "$smoke_ok" -ne 1 ]; then
              echo "::warning title=Smoke /healthz not green (avorelio)::$url did not return 200 within 60s. The deploy succeeded and api is healthy in-container; OUR Traefik's Let's Encrypt issuance (HTTP-01, resolver 'le') or the avorelio.shop A-record may still be settling. Re-run once ready."
            fi
            echo "[avorelio] prune dangling build layers (best-effort)"
            docker image prune -f || true
            echo "[avorelio] deployed and healthy"
