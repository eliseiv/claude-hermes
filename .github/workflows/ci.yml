# CI gate + gated deploy (07-deployment.md §CI/CD, 06-testing-strategy.md §CI gate, ADR-057).
# Platform: GitHub Actions (CI platform not fixed in docs -> reasonable default).
# Any failure on lint / format / type-check / tests / coverage blocks merge AND blocks deploy.
#
# DEPLOY ORDERING (incident fix): deploy is a JOB IN THIS WORKFLOW (`deploy-avorelio`) with
# `needs: [quality, test, build-image]`, so GitHub will NOT start it until ALL CI jobs have
# succeeded. Previously deploy was a SEPARATE workflow also triggered on push:main, so it ran
# in PARALLEL with CI and could deploy a red build. With `needs` + `if: ...success()` the deploy
# is deterministically gated: a failing CI job fails the workflow and deploy never starts.
# Manual / out-of-band redeploys live in deploy.yml (workflow_dispatch only — no push trigger).
#
# SINGLE DEPLOY TARGET: claude-hermes is deployed ONLY to its OWN dedicated server avorelio
# (87.239.135.156, self-hosted Traefik, ADR-057). There is exactly one deploy job here
# (`deploy-avorelio`). This repo does NOT deploy to any shared/foreign server.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# NOTE: this `concurrency` only applies to the CI jobs (quality/test/build-image). The deploy
# job below sets its OWN job-level concurrency (`deploy-avorelio`, no cancel) so an in-flight
# deploy is never cancelled even though superseded CI runs are.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.4.30"
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: lint • format • types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps (uv sync)
        run: uv sync --frozen

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  test:
    name: test • coverage gate
    runs-on: ubuntu-latest
    # Integration/e2e use testcontainers, which need a Docker daemon (present on
    # ubuntu-latest runners). No service containers declared: testcontainers manages them.
    #
    # COVERAGE_CORE=sysmon (PEP 669 sys.monitoring) instead of the legacy per-thread C settrace
    # tracer. Primary motive is a Windows `--cov` access-violation segfault (settrace firing across
    # native C frames in asyncio.to_thread worker threads); harmless and faster on Linux runners
    # too. Authoritative setting is pyproject [tool.coverage.run] core="sysmon" — this job-level
    # env is a belt-and-suspenders fallback covering BOTH coverage steps below for any coverage
    # build that ignores the `core` config key.
    env:
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install deps (uv sync)
        run: uv sync --frozen

      # Global coverage gate: 80% (02-tech-stack.md, 06-testing-strategy.md).
      - name: Pytest + coverage (global gate 80%)
        run: >
          uv run pytest
          --cov=src
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      # Critical packages must hit >=95% (06-testing-strategy.md §Coverage gate).
      - name: Critical-package coverage gate (policy/wallet/byok >=95%)
        run: >
          uv run pytest
          --cov=src/app/policy
          --cov=src/app/wallet
          --cov=src/app/byok
          --cov-report=term-missing
          --cov-fail-under=95
          tests/unit tests/integration

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  build-image:
    name: build docker image (validation only)
    runs-on: ubuntu-latest
    needs: [quality, test]
    # ADR-057 (== ADR-017): the deployable image is BUILT ON THE SERVER
    # (`docker compose up -d --build`), NOT pushed to a registry. This job only VALIDATES that the
    # Dockerfile builds — it does not log in to or push to any registry (no `packages: write`, no
    # GHCR). The gated deploy is the `deploy-avorelio` job below; manual redeploys live in
    # .github/workflows/deploy.yml (SSH -> git pull -> compose up --build).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          tags: claude-hermes-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------------------------
  # Gated deploy — DEDICATED server avorelio (87.239.135.156) + OUR self-hosted Traefik
  # (docs/07-deployment.md §Топология №2, ADR-057). This is the ONLY deploy target for
  # claude-hermes: a single instance in /opt/claude-hermes on .156, using the prod compose +
  # the docker-compose.avorelio.yml overlay (adds OUR traefik + an internal `web` network).
  #
  # Hard CI gate: `needs: [quality, test, build-image]` + the main-branch / success() guard, so it
  # only runs on a green push to main (ADR-057 §5).
  #
  # Image is BUILT ON THE SERVER from sources (no registry/immutable tag, ADR-057 §5 == ADR-017).
  #
  # Flow: SSH to .156 -> cd /opt/claude-hermes -> git pull --ff-only ->
  #   compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml build api migrate ->
  #   run --rm migrate -> up postgres redis traefik (normal) + up --force-recreate api (ONLY api,
  #   so it adopts the freshly built image; stateful/edge untouched) -> readiness gate
  #   (claude-hermes-api-1 healthy = compose healthcheck GET /ready: db+redis) -> NON-FATAL public
  #   smoke https://avorelio.shop/healthz.
  # Hardened pattern: script_stop:false, `set -uo pipefail` (NO `-e`), readiness via
  # `docker inspect ... .State.Health.Status`. NOTE: on the FIRST deploy OUR Traefik issues the
  # Let's Encrypt cert for avorelio.shop (HTTP-01 over port 80) — DNS/ACME may still be settling, so
  # the public smoke is NON-FATAL (warning). Real failures (build/migrate/api-not-healthy) still
  # turn the job red via the explicit rc checks + readiness gate; the fused exit code of
  # `up --build` is not trusted (we split build/migrate/up).
  #
  # GitHub Secrets (Settings -> Secrets and variables -> Actions): NEVER hardcode these.
  #   SSH_HOST_AVORELIO=87.239.135.156
  #   SSH_USER=root
  #   SSH_PRIVATE_KEY  (public half in .156's ~/.ssh/authorized_keys)
  # The server's /opt/claude-hermes/.env (incl. ACME_EMAIL, SERVICE_DOMAIN=avorelio.shop,
  # TRAEFIK_CERTRESOLVER=le, DB/LLM secrets) is provisioned ON THE SERVER from the secret manager
  # (ADR-057 §5), NOT through GitHub Secrets. `.env` is gitignored and survives `git pull`.
  #
  # ROLLBACK (no registry/immutable tag), on .156 in /opt/claude-hermes:
  #   git log --oneline -n 5 ; git checkout <prev-commit>
  #   docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env build api migrate
  #   docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env run --rm migrate  # if needed (expand/contract)
  #   docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env up -d --no-build --no-deps --force-recreate api
  # (force-recreate ONLY api so it adopts the rolled-back image — same stale-code footgun applies to
  # rollback; postgres/redis/traefik are already up and are NOT force-recreated.)
  # The traefik container is NOT changed on rollback (its image is pinned, config lives in the
  # compose overlay). Schema is NOT reverted (expand/contract keeps old code compatible).
  deploy-avorelio:
    name: ssh deploy (dedicated .156 + self-hosted Traefik)
    runs-on: ubuntu-latest
    needs: [quality, test, build-image]
    if: ${{ github.ref == 'refs/heads/main' && success() }}
    environment: production
    permissions:
      contents: read
    # Single in-flight deploy for this target; do NOT cancel one mid-run (avoid half-applied
    # state). Job-level concurrency, independent of the workflow-level `ci-*` group above.
    concurrency:
      group: deploy-avorelio
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH (avorelio .156)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_AVORELIO }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # script_stop MUST be false so the remote shell behaviour is governed solely by our
          # `set -uo pipefail` (NO `-e`). Real failures (build/migrate/api-not-healthy) are caught
          # by explicit rc checks + the readiness gate and turn the job red via the final `exit 1`;
          # the spurious fused exit code of `up --build` is not trusted (we split build/migrate/up).
          script_stop: false
          script: |
            set -uo pipefail   # NO `-e` on purpose (real failures caught by explicit rc checks + readiness gate)
            DIR=/opt/claude-hermes
            PROJ=claude-hermes
            COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.avorelio.yml --env-file .env"
            echo "[avorelio] === dir=$DIR project=$PROJ (self-hosted Traefik) ==="
            cd "$DIR" || { echo "::error title=cd failed::$DIR missing on .156"; exit 1; }
            echo "[avorelio] git pull --ff-only"
            if ! git pull --ff-only; then
              echo "::error title=git pull failed::ff-only pull failed in $DIR"; exit 1
            fi
            # Freshly pulled HEAD — used to BUST the Docker source layer so `build` can NEVER serve a
            # stale-code image on a green deploy (SECOND deploy incident: a cache-HIT on `COPY src`
            # baked OLD code; only `build --no-cache` helped). Dockerfile consumes `ARG GIT_SHA` in a
            # RUN right before `COPY src`, so a new commit changes the cache key of the SOURCE layer
            # only — the uv.lock-keyed deps layer stays cached (NO full --no-cache, no ~5-min rebuild).
            GIT_SHA="$(git rev-parse HEAD)"
            if [ -z "$GIT_SHA" ]; then
              echo "::error title=git rev-parse failed::empty HEAD in $DIR"; exit 1
            fi
            echo "[avorelio] building GIT_SHA=$GIT_SHA"
            # (1) Build api + migrate images on the server (REAL build failure => fail).
            echo "[avorelio] build api migrate (built on the server; source layer busted by GIT_SHA)"
            if ! $COMPOSE build --build-arg GIT_SHA="$GIT_SHA" api migrate; then
              echo "::error title=build failed::docker compose build returned non-zero"; exit 1
            fi
            # (2) Migrate explicitly BEFORE api (REAL migration failure => fail).
            echo "[avorelio] migrate (alembic upgrade head)"
            if ! $COMPOSE run --rm migrate; then
              echo "::error title=migrate failed::alembic upgrade head returned non-zero"; exit 1
            fi
            # (3) Bring the stack up. No build here (image already built in step 1). SPLIT into
            #     two ups so ONLY api is force-recreated — see the incident note below.
            #
            #     INCIDENT ROOT CAUSE (stale code on a GREEN deploy): `docker compose up -d`
            #     decides whether to recreate a container from the service CONFIG hash, which
            #     references the image by its STABLE TAG (${COMPOSE_PROJECT_NAME}-backend:prod),
            #     NOT the resolved image ID. Rebuilding under that same tag leaves the config hash
            #     unchanged, so a plain `up -d --no-build` (no explicit service) saw "no change"
            #     and KEPT the OLD api container (old image ID) even though step 1 rebuilt the
            #     image and step 2 applied the migration. /ready (db+redis) still passed because it
            #     does NOT reflect the code version -> a green deploy running stale code (new API
            #     fields returned null). Fix: force-recreate api UNCONDITIONALLY; NEVER
            #     force-recreate the stateful/edge services (postgres=data+downtime, redis=cache,
            #     traefik=owns :443 + holds Let's Encrypt/ACME state) — a needless recreate there
            #     risks data loss, downtime and cert re-issuance.
            #
            #     (3a) postgres + redis + traefik: NORMAL up (starts them only if down, leaves
            #          already-healthy ones UNTOUCHED — no --force-recreate). --no-deps so traefik
            #          (depends_on api) does not drag api into this step.
            echo "[avorelio] up postgres redis traefik (normal up — protect stateful/ACME; NO force-recreate)"
            up_infra_rc=0
            $COMPOSE up -d --no-build --no-deps postgres redis traefik || up_infra_rc=$?
            echo "[avorelio] up(infra) rc=$up_infra_rc (informational)"
            #     (3b) api ONLY: --force-recreate so the container ALWAYS adopts the freshly built
            #          image regardless of the unchanged config hash. --no-deps because api's deps
            #          are ALREADY satisfied (migrate ran in step 2; postgres/redis up in 3a) and to
            #          GUARANTEE --force-recreate cannot touch postgres/redis/traefik. rc recorded
            #          but NOT trusted (BuildKit session can make `up` non-zero benignly) — the
            #          readiness gate (4) is the source of truth.
            echo "[avorelio] up --force-recreate api ONLY (adopt freshly built image; stateful UNTOUCHED)"
            up_rc=0
            $COMPOSE up -d --no-build --no-deps --force-recreate api || up_rc=$?
            echo "[avorelio] up(api) rc=$up_rc (informational; readiness gate decides)"
            # (4) Deterministic readiness gate: api MUST become healthy (compose healthcheck =
            #     GET /ready: db+redis). Container name is ${PROJ}-api-1 == claude-hermes-api-1.
            echo "[avorelio] readiness gate: api container health"
            ready=0
            for i in $(seq 1 30); do
              h="$(docker inspect "${PROJ}-api-1" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
              if [ "$h" = "healthy" ]; then echo "[avorelio] api healthy ($i)"; ready=1; break; fi
              echo "[avorelio] api health=$h ($i/30) — retrying in 2s"; sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error title=api not healthy::api did not become healthy within ~60s (up rc=$up_rc). Last logs:"
              docker logs "${PROJ}-api-1" --tail 40 2>&1 || true
              exit 1
            fi
            # Public smoke through OUR Traefik (TLS + Host routing) on avorelio.shop. NON-FATAL:
            # on the first deploy OUR Traefik is still issuing the Let's Encrypt cert (HTTP-01),
            # and DNS/A-record may still be settling — retry 12 x 5s = 60s, then ::warning:: only.
            url="https://avorelio.shop/healthz"
            echo "[avorelio:smoke] GET $url"
            smoke_ok=0
            for i in $(seq 1 12); do
              if curl -fsS --max-time 5 "$url" >/dev/null; then
                echo "[avorelio:smoke] healthz OK"; smoke_ok=1; break
              fi
              echo "[avorelio:smoke] not ready ($i/12) — retrying in 5s"; sleep 5
            done
            if [ "$smoke_ok" -ne 1 ]; then
              echo "::warning title=Smoke /healthz not green (avorelio)::$url did not return 200 within 60s. The deploy (build+migrate+up) succeeded and api is healthy in-container; OUR Traefik's Let's Encrypt issuance (HTTP-01, resolver 'le') or the avorelio.shop A-record may still be settling on the first deploy. Re-run this workflow once they are ready."
            fi
            echo "[avorelio] prune dangling build layers (best-effort)"
            docker image prune -f || true
            echo "[avorelio] deployed and healthy"
